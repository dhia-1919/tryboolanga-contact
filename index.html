<!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Send a request to Hamdan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f4f2fb;
    font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    padding: 24px;
  }

  .card {
    position: relative;
    width: 100%;
    max-width: 449px;
    background: #E9E5F8;
    border-radius: 22px;
    padding: 32px 32px 40px;
    box-shadow: 0 10px 30px rgba(60, 50, 110, 0.08);
  }

  .close-btn {
    position: absolute;
    top: 22px;
    right: 24px;
    width: 22px;
    height: 22px;
    cursor: pointer;
    border: none;
    background: transparent;
    padding: 0;
  }

  .close-btn svg {
    width: 100%;
    height: 100%;
    stroke: #1B1B3A;
    stroke-width: 2.4;
  }

  h1 {
    margin: 0 0 30px 0;
    font-size: 25px;
    font-weight: 800;
    color: #17173A;
    line-height: 1.3;
    padding-right: 30px;
  }

  .field {
    margin-bottom: 22px;
  }

  label {
    display: block;
    font-size: 15px;
    font-weight: 700;
    color: #17173A;
    margin-bottom: 8px;
  }

  input {
    width: 100%;
    height: 52px;
    padding: 0 16px;
    border-radius: 12px;
    border: 1.5px solid #D3CFE8;
    background: #ffffff;
    font-family: inherit;
    font-size: 15px;
    color: #17173A;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  input::placeholder {
    color: #B5B0CE;
  }

  input:focus {
    border-color: #6E5FDE;
    box-shadow: 0 0 0 4px rgba(110, 95, 222, 0.15);
  }

  .send-btn {
    width: 100%;
    margin-top: 8px;
    height: 58px;
    border: none;
    border-radius: 16px;
    background: #F3A94D;
    color: #1B1B3A;
    font-family: inherit;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    transition: filter 0.15s ease, transform 0.05s ease;
  }

  .send-btn:hover {
    filter: brightness(1.04);
  }

  .send-btn:active {
    transform: scale(0.99);
  }

  .send-btn:disabled {
    opacity: 0.7;
    cursor: not-allowed;
  }

  .error-msg {
    display: none;
    margin-top: 14px;
    font-size: 13.5px;
    color: #C0392B;
    text-align: center;
  }

  /* ---------- Popup ---------- */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(23, 23, 58, 0.45);
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 1000;
  }

  .overlay.active {
    display: flex;
  }

  .popup {
    background: #ffffff;
    border-radius: 20px;
    max-width: 380px;
    width: 100%;
    padding: 36px 28px 28px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
    animation: popIn 0.25s ease;
  }

  @keyframes popIn {
    from { opacity: 0; transform: scale(0.92); }
    to { opacity: 1; transform: scale(1); }
  }

  .popup-icon {
    width: 64px;
    height: 64px;
    margin: 0 auto 18px;
    border-radius: 50%;
    background: #E9F6EC;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .popup-icon svg {
    width: 30px;
    height: 30px;
    stroke: #3CA95B;
    stroke-width: 3;
    fill: none;
  }

  .popup p {
    font-size: 16px;
    font-weight: 600;
    color: #17173A;
    line-height: 1.5;
    margin: 0 0 26px 0;
  }

  .popup-btn {
    width: 100%;
    height: 52px;
    border: none;
    border-radius: 14px;
    background: #F3A94D;
    color: #1B1B3A;
    font-family: inherit;
    font-size: 15.5px;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .popup-btn:hover {
    filter: brightness(1.04);
  }
</style>
</head>
<body>

<div class="card">
  <button class="close-btn" type="button" aria-label="Close" onclick="document.querySelector('.card').style.display='none'">
    <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="6" y1="6" x2="18" y2="18"></line>
      <line x1="18" y1="6" x2="6" y2="18"></line>
    </svg>
  </button>

  <h1>Send a request to Hamdan</h1>

  <form id="requestForm">
    <div class="field">
      <label for="fullName">Full name</label>
      <input type="text" id="fullName" name="fullName" required>
    </div>

    <div class="field">
      <label for="workEmail">Work email</label>
      <input type="email" id="workEmail" name="workEmail" required>
    </div>

    <div class="field">
      <label for="companyName">Company name</label>
      <input type="text" id="companyName" name="companyName" required>
    </div>

    <div class="field">
      <label for="features">Which feature do you need access to?</label>
      <input type="text" id="features" name="features" required>
    </div>

    <button type="submit" class="send-btn" id="sendBtn">Send</button>
    <p class="error-msg" id="errorMsg">Something went wrong sending your request. Please try again in a moment.</p>
  </form>
</div>

<!-- Success popup -->
<div class="overlay" id="overlay">
  <div class="popup">
    <div class="popup-icon">
      <svg viewBox="0 0 24 24"><polyline points="4 12 9 17 20 6"></polyline></svg>
    </div>
    <p>Thank you for contacting us! Your request has been sent to Hamdan</p>
    <a class="popup-btn" href="https://demo.boolanga.com">Go back to TryBoolanga</a>
  </div>
</div>

<script>
  // ---------------------------------------------------------------
  // Email delivery via FormSubmit.co (no backend / server required)
  //
  // IMPORTANT ONE-TIME STEP:
  // The very first time this form is submitted from your live domain,
  // FormSubmit will send an "activation" email to hamdan@boolanga.com.
  // Someone must open that email and click the confirmation link once.
  // After that, every future submission will be delivered automatically.
  // ---------------------------------------------------------------
  const RECIPIENT_EMAIL = "hamdan@boolanga.com";

  const form = document.getElementById("requestForm");
  const sendBtn = document.getElementById("sendBtn");
  const errorMsg = document.getElementById("errorMsg");
  const overlay = document.getElementById("overlay");

  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    errorMsg.style.display = "none";

    const fullName = document.getElementById("fullName").value.trim();
    const workEmail = document.getElementById("workEmail").value.trim();
    const companyName = document.getElementById("companyName").value.trim();
    const features = document.getElementById("features").value.trim();

    const subject = `Features Request from ${fullName}`;
    const message =
`Hi Hamdan,

You have a new features request, here are the details :

* Full name : ${fullName}
* Work email : ${workEmail}
* Company name : ${companyName}
* Requested features : ${features}`;

    sendBtn.disabled = true;
    sendBtn.textContent = "Sending...";

    try {
      const response = await fetch(`https://formsubmit.co/ajax/${RECIPIENT_EMAIL}`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Accept": "application/json"
        },
        body: JSON.stringify({
          _subject: subject,
          _captcha: "false",
          name: fullName,
          email: workEmail,
          company: companyName,
          requested_features: features,
          message: message
        })
      });

      if (!response.ok) throw new Error("Request failed");

      overlay.classList.add("active");
      form.reset();
    } catch (err) {
      errorMsg.style.display = "block";
    } finally {
      sendBtn.disabled = false;
      sendBtn.textContent = "Send";
    }
  });
</script>

</body>
</html>
